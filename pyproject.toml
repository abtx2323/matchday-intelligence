[project]
name = "matchday-intelligence"
version = "0.1.0"
description = "Multi-agent pipeline turning synthetic football events into explainable, personalized match intelligence overlays"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C90", "BLE", "SIM"]
ignore = ["S311"]  # random is used for seeded synthetic data, not cryptography

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"app/agents/i18n.py" = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 25
